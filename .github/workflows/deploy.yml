name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Builds the site for the domain root and publishes it to the "cpanel" branch.
  # On the Hostico cPanel (bbegypt.com): Git Version Control → Update from Remote → Deploy HEAD Commit.
  cpanel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash deploy/build-cpanel.sh
      - name: Publish the cpanel branch
        # Adds a new commit on top of the existing cpanel branch (never rewrites it),
        # so cPanel's "Update from Remote" is always a simple fast-forward pull.
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          if git ls-remote --exit-code --heads "$REPO_URL" cpanel >/dev/null; then
            git clone -q --depth 1 --branch cpanel "$REPO_URL" .
          else
            git init -q -b cpanel && git remote add origin "$REPO_URL"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/cpanel-out/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "Built site for cPanel from ${GITHUB_SHA::7}"
          git push origin HEAD:cpanel
